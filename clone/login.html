<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — Richard's Clone</title>
<style>
  :root {
    --bg: #ffffff; --fg: #111318; --muted: #5b6472; --card: #f4f5f7;
    --line: #e2e5ea; --accent: #2f6fed; --err: #d63333;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101318; --fg: #eceff4; --muted: #9aa3b0; --card: #1a1f27;
      --line: #2a3140; --accent: #6fa0ff; --err: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100dvh; display: grid; place-items: center; padding: 16px;
  }
  form {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 24px; width: 100%; max-width: 360px;
  }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 20px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 12px 0 4px; }
  input {
    width: 100%; font: inherit; padding: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  button {
    width: 100%; margin-top: 20px; font: inherit; border: 0; border-radius: 10px;
    padding: 12px; background: var(--accent); color: #fff; min-height: 48px; cursor: pointer;
  }
  button:disabled { opacity: .5; }
  .error { color: var(--err); font-size: .85rem; margin-top: 12px; min-height: 1.2em; }
</style>
</head>
<body>
<form id="form" autocomplete="on">
  <h1>🧠 Richard's Clone</h1>
  <div class="sub">An AI clone of Richard B. — sign in to talk to it.</div>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="none" required>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="go">Sign in</button>
  <div id="err" class="error"></div>
</form>
<script>
document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go');
  const err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const res = await fetch('/clone/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('u').value.trim(),
        password: document.getElementById('p').value,
      }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Sign-in failed.');
    location.href = '/clone/app';
  } catch (ex) {
    err.textContent = ex.message;
    btn.disabled = false;
  }
};
</script>
</body>
</html>
